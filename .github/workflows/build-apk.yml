name: Build Market Client Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ================================================
      # 1. Checkout repository
      # ================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ================================================
      # 2. Java 17
      # ================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ================================================
      # 3. Find / extract Android project
      # ================================================
      - name: Prepare Android project
        id: project
        shell: bash
        run: |

          echo "========================================"
          echo "Searching for Android project"
          echo "========================================"

          PROJECT_DIR=$(find . \
            -type f \
            -name "settings.gradle" \
            -not -path './.git/*' \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then

            echo "Android project not directly found."
            echo "Searching for ZIP..."

            ZIP_FILE=$(find . \
              -type f \
              -name "*.zip" \
              -not -path './.git/*' \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found."
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf extracted-project
            mkdir -p extracted-project

            unzip -q "$ZIP_FILE" -d extracted-project

            echo "ZIP extracted."

            PROJECT_DIR=$(find extracted-project \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            find . -maxdepth 7 -type f \
              -not -path './.git/*' \
              | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "========================================"
          echo "Android project:"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ================================================
      # 4. Validate project
      # ================================================
      - name: Validate Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          echo "Project directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -d app

          echo ""
          echo "Android project validation successful."


      # ================================================
      # 5. Configure existing Android SDK
      # ================================================
      - name: Configure Android SDK
        shell: bash
        run: |

          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is not set."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Latest sdkmanager not found."

            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f \
              | sort \
              | tail -1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Installing required SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready."


      # ================================================
      # 6. Set up Gradle
      # ================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9


      # ================================================
      # 7. Check Java / Gradle / Android
      # ================================================
      - name: Check build environment
        run: |

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true


      # ================================================
      # 8. Build APK
      # ================================================
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          echo "========================================"
          echo "Building Market Client Manager"
          echo "========================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ================================================
      # 9. Verify APK
      # ================================================
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          echo "Generated APK files:"

          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK generated successfully."


      # ================================================
      # 10. Rename APK
      # ================================================
      - name: Rename APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MarketClientManager-v2.1.3-debug.apk"


      # ================================================
      # 11. Upload APK
      # ================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketClientManager-v2.1.3-debug
          path: MarketClientManager-v2.1.3-debug.apk
          if-no-files-found: error
