name: Build Market Client Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Unzip the exact ZIP file
      - name: Unzip Market Client Manager
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "Market Client Manager.zip" -d extracted

          echo "ZIP extracted successfully"
          find extracted -maxdepth 3 -type f | head -100

      # 3. Find Android project
      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -type f | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 5. Configure existing Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Set up Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # 7. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building Android APK..."
          gradle :app:assembleDebug --no-daemon --stacktrace

      # 8. Check APK
      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -lh app/build/outputs/apk/debug/

      # 9. Rename APK
      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "${GITHUB_WORKSPACE}/MarketClientManager.apk"

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketClientManager-APK
          path: MarketClientManager.apk
