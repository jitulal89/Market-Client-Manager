name: Build Market Client Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. Extract EXACT v2.1.6 ZIP
      # =========================================================
      - name: Extract Market Client Manager v2.1.6
        id: project
        shell: bash
        run: |

          set -e

          echo "=============================================="
          echo "MARKET CLIENT MANAGER v2.1.6"
          echo "=============================================="

          ZIP_FILE="MarketClientManager_v2.1.6.zip"

          echo ""
          echo "Looking for:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: $ZIP_FILE was not found."

            echo ""
            echo "Available ZIP files:"

            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -not -path './.git/*' \
              | sort

            exit 1
          fi

          echo ""
          echo "ZIP found:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Extracting..."

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo ""
          echo "ZIP extraction completed."


          # -------------------------------------------------------
          # Find Android project
          # -------------------------------------------------------

          PROJECT_DIR=$(find extracted-project \
            -type f \
            -name "settings.gradle" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: settings.gradle was not found inside ZIP."

            echo ""
            echo "Extracted files:"

            find extracted-project \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi


          echo ""
          echo "=============================================="
          echo "ANDROID PROJECT FOUND"
          echo "=============================================="

          echo "$PROJECT_DIR"

          echo ""
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 4. Validate Android project
      # =========================================================
      - name: Validate Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |

          set -e

          echo "=============================================="
          echo "VALIDATING ANDROID PROJECT"
          echo "=============================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Checking required files..."

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -d app
          test -f app/build.gradle

          echo ""
          echo "All required project files found."

          echo ""
          echo "Android project validation successful."


      # =========================================================
      # 5. Configure Android SDK
      #
      # IMPORTANT:
      # No android-actions/setup-android
      # No chmod
      # =========================================================
      - name: Configure Android SDK
        shell: bash
        run: |

          set -e

          echo "=============================================="
          echo "CONFIGURING ANDROID SDK"
          echo "=============================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not set."
            exit 1
          fi


          # -------------------------------------------------------
          # Locate sdkmanager
          # -------------------------------------------------------

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then

            echo ""
            echo "Searching for sdkmanager..."

            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f \
              -perm -111 \
              2>/dev/null \
              | sort \
              | tail -1)

          fi


          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then

            echo ""
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_HOME" \
              -name sdkmanager \
              -type f \
              2>/dev/null || true

            exit 1
          fi


          echo ""
          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"

          "$SDKMANAGER" --version


          # -------------------------------------------------------
          # Accept licenses
          # -------------------------------------------------------

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null || true


          # -------------------------------------------------------
          # Install required components
          # -------------------------------------------------------

          echo ""
          echo "Installing/checking Android SDK components..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          echo ""
          echo "Android SDK ready."


      # =========================================================
      # 6. Gradle 8.9
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # =========================================================
      # 7. Verify build environment
      # =========================================================
      - name: Check build environment
        shell: bash
        run: |

          set -e

          echo "=============================================="
          echo "BUILD ENVIRONMENT"
          echo "=============================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Checking Android 35..."

          test -d "$ANDROID_HOME/platforms/android-35"

          echo ""
          echo "Checking Build Tools..."

          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "Build environment is ready."


      # =========================================================
      # 8. Build APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |

          set -e

          echo "=============================================="
          echo "BUILDING APK"
          echo "=============================================="

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."


      # =========================================================
      # 9. Verify APK
      # =========================================================
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |

          set -e

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking:"
          echo "$APK_PATH"

          if [ ! -f "$APK_PATH" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            find app/build/outputs \
              -maxdepth 6 \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK successfully generated."

          ls -lh "$APK_PATH"


      # =========================================================
      # 10. Rename APK
      # =========================================================
      - name: Rename APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |

          set -e

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MarketClientManager-v2.1.3-debug.apk"

          echo ""
          echo "APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/MarketClientManager-v2.1.3-debug.apk"


      # =========================================================
      # 11. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketClientManager-v2.1.3-debug
          path: MarketClientManager-v2.1.3-debug.apk
          if-no-files-found: error
