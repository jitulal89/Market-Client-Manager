name: Build Market Client Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for settings.gradle..."

          PROJECT_DIR=$(find . -name settings.gradle -type f \
            -not -path './.git/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$GITHUB_WORKSPACE/MarketClientManager-v2.1.3-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketClientManager-v2.1.3-debug
          path: MarketClientManager-v2.1.3-debug.apk
