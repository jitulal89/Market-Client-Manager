name: Build Market Client Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout GitHub repository
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Set up Java
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Find or extract Android project
      # --------------------------------------------------
      - name: Prepare Android project
        id: project
        shell: bash
        run: |

          echo "========================================"
          echo "Checking repository contents"
          echo "========================================"

          find . -maxdepth 3 -type f \
            -not -path './.git/*' \
            | sort

          echo ""
          echo "========================================"
          echo "Searching for settings.gradle"
          echo "========================================"

          PROJECT_DIR=$(find . \
            -type f \
            -name "settings.gradle" \
            -not -path './.git/*' \
            -print -quit \
            | xargs -r dirname)

          # ------------------------------------------------
          # If settings.gradle is not found, look for ZIP
          # ------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo "settings.gradle not found."
            echo "Searching for ZIP project..."

            ZIP_FILE=$(find . \
              -type f \
              -name "*.zip" \
              -not -path './.git/*' \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo ""
              echo "ERROR: No Android project or ZIP file found."
              echo ""
              echo "Repository contents:"
              find . -maxdepth 5 -type f \
                -not -path './.git/*' \
                | sort
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            mkdir -p extracted-project

            echo "Extracting ZIP..."

            unzip -q "$ZIP_FILE" -d extracted-project

            echo "ZIP extracted."

            echo ""
            echo "Searching extracted project..."

            PROJECT_DIR=$(find extracted-project \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)

          fi


          # ------------------------------------------------
          # Validate project
          # ------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: settings.gradle still not found."
            echo ""
            echo "Extracted files:"
            find . -maxdepth 6 -type f \
              -not -path './.git/*' \
              | sort
            exit 1
          fi


          PROJECT_DIR="${PROJECT_DIR#./}"

          echo ""
          echo "========================================"
          echo "Android project found"
          echo "========================================"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 4. Show project structure
      # --------------------------------------------------
      - name: Validate Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking required files..."

          test -f settings.gradle
          test -f build.gradle
          test -d app
          test -f app/build.gradle

          echo ""
          echo "Android project validation successful."


      # --------------------------------------------------
      # 5. Set up Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # 6. Install Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK
        run: |

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # --------------------------------------------------
      # 7. Install Gradle
      # --------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9


      # --------------------------------------------------
      # 8. Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          echo "Building Market Client Manager..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 9. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          echo "Checking generated APK..."

          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK successfully generated."


      # --------------------------------------------------
      # 10. Rename APK
      # --------------------------------------------------
      - name: Rename APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |

          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/MarketClientManager-v2.1.3-debug.apk"


      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketClientManager-v2.1.3-debug
          path: MarketClientManager-v2.1.3-debug.apk
          if-no-files-found: error
