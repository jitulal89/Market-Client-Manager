name: Build Market Client Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Market Client Manager
        run: |
          mkdir -p extracted
          unzip -q "MarketClientManager.zip" -d extracted

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found in Market Client Manager.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "${GITHUB_WORKSPACE}/MarketClientManager.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketClientManager-APK
          path: MarketClientManager.apk
